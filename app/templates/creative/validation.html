{% extends "base.html" %}
{% block title %}{{ t('common.error') }}{% endblock %}
{% block content %}
<div class="wrap-narrow page">
  <div class="card">
    <h1 style="font-size:22px">{{ t('common.error') }}</h1>

  </div>
</div>
{% endblock %}
